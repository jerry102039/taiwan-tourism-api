# Render.com Blueprint：在 Render 選 New > Blueprint 並指定此 GitHub repo 即可一鍵部署
services:
  - type: web
    name: taiwan-tourism-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: API_KEY
        value: ntub-iot-2026
